name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    env:
      RAITEI_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      BUILD_ATTEMPTS: 3
      RETRY_DELAY_SECONDS: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the vcpkg binary cache
        shell: pwsh
        run: |
          $binaries = Join-Path $env:RUNNER_TEMP "vcpkg-binaries"
          New-Item -ItemType Directory -Force $binaries | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$binaries" >> $env:GITHUB_ENV

      - name: Restore vcpkg binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binaries
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le $env:BUILD_ATTEMPTS; $attempt++) {
            & .\build.bat
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::build attempt $attempt failed"
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            if ($attempt -lt $env:BUILD_ATTEMPTS) { Start-Sleep -Seconds $env:RETRY_DELAY_SECONDS }
          }
          exit 1

      - name: Save vcpkg binaries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binaries
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: raitei
          path: |
            build/raitei.dll
            build/raitei.pdb

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" build/raitei.dll build/raitei.pdb --title "Raitei $env:GITHUB_REF_NAME" --generate-notes
